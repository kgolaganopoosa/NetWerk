<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NetWerk – Social Media Hub</title>
  <meta name="description" content="NetWerk - Quick access to your favorite social media platforms.">
  <meta name="theme-color" content="#0d0f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NetWerk">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-bg: rgba(255, 255, 255, 0.06);
      --card-hover-border: rgba(255, 255, 255, 0.18);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --brand: #6366f1;
      --brand-glow: rgba(99, 102, 241, 0.35);
      
      --facebook: #1877f2;
      --youtube: #ff0000;
      --wechat: #07c160;
      --telegram: #0088cc;
      
      --radius: 24px;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.25;
    }
    body::before {
      top: -100px;
      left: -100px;
      background: #4f46e5;
    }
    body::after {
      bottom: -100px;
      right: -100px;
      background: #ec4899;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      padding-top: 1rem;
    }

    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 30%, #9ca3af 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }

    .tagline {
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
      flex: 1;
    }

    @media (min-width: 580px) {
      .apps-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
      }
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.85rem 1.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .app-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(255, 255, 255, 0.05), transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .app-card:hover, .app-card:focus-visible {
      transform: translateY(-6px);
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 255, 255, 0.03);
      outline: none;
    }

    .app-card:hover::before {
      opacity: 1;
    }

    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.85rem;
      margin-bottom: 1rem;
      color: white;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .app-card:hover .icon-wrapper {
      transform: scale(1.08);
    }

    .facebook .icon-wrapper { background: var(--facebook); }
    .instagram .icon-wrapper {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    }
    .youtube .icon-wrapper { background: var(--youtube); }
    .tiktok .icon-wrapper { background: #121212; border: 1px solid rgba(255,255,255,0.1); }
    .tiktok .icon-wrapper i {
      background: linear-gradient(45deg, #25f4ee, #fe2c55);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .wechat .icon-wrapper { background: var(--wechat); }
    .telegram .icon-wrapper { background: var(--telegram); }

    .app-name {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 0.75rem;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .open-btn {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .app-card:hover .open-btn {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      text-align: center;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.5rem;
      margin-bottom: 1rem;
    }

    .footer-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.25rem 0;
      font-family: inherit;
      transition: color 0.2s ease;
    }

    .footer-btn:hover, .footer-btn:focus-visible {
      color: #ffffff;
      outline: none;
    }

    .copyright {
      font-size: 0.8rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* Modern Glass Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 10, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal {
      background: #12151f;
      border-radius: 28px;
      max-width: 540px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 2.25rem;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: var(--shadow);
      color: var(--text);
    }

    .modal-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    #modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      padding-right: 2.5rem;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .modal-content {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .modal-content p { margin-bottom: 1rem; }
    .modal-content h3 {
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      margin: 1.5rem 0 0.5rem;
    }

    /* Sleek Install Banner */
    .install-banner {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: 1.5rem;
      max-width: 440px;
      margin: 0 auto;
      background: rgba(18, 21, 31, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 1100;
      transform: translateY(120%);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }

    .install-banner.show {
      transform: translateY(0);
      opacity: 1;
    }

    .install-banner.hidden {
      display: none;
    }

    .install-icon {
      width: 50px;
      height: 50px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px var(--brand-glow);
    }

    .install-icon span {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      display: block;
    }

    .install-text {
      flex: 1;
      min-width: 0;
    }

    .install-text strong {
      display: block;
      font-size: 0.95rem;
      color: #ffffff;
      margin-bottom: 0.1rem;
      font-weight: 600;
    }

    .install-text span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .install-actions {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .install-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .install-btn:hover {
      background: #f3f4f6;
      transform: scale(1.03);
    }

    .install-dismiss {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
      padding: 0.1rem;
      transition: color 0.2s ease;
    }

    .install-dismiss:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 class="logo">NetWerk</h1>
      <p class="tagline">Your social media, one click away</p>
    </header>
    <main class="apps-grid">
      <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="app-card facebook">
        <div class="icon-wrapper"><i class="fab fa-facebook-f"></i></div>
        <span class="app-name">Facebook</span>
        <span class="open-btn">Open</span>
      </a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="app-card instagram">
        <div class="icon-wrapper"><i class="fab fa-instagram"></i></div>
        <span class="app-name">Instagram</span>
        <span class="open-btn">Open</span>
      </a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" class="app-card youtube">
        <div class="icon-wrapper"><i class="fab fa-youtube"></i></div>
        <span class="app-name">YouTube</span>
        <span class="open-btn">Open</span>
      </a>
      <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer" class="app-card tiktok">
        <div class="icon-wrapper"><i class="fab fa-tiktok"></i></div>
        <span class="app-name">TikTok</span>
        <span class="open-btn">Open</span>
      </a>
      <a href="https://www.wechat.com/" target="_blank" rel="noopener noreferrer" class="app-card wechat">
        <div class="icon-wrapper"><i class="fab fa-weixin"></i></div>
        <span class="app-name">WeChat</span>
        <span class="open-btn">Open</span>
      </a>
      <a href="https://web.telegram.org/" target="_blank" rel="noopener noreferrer" class="app-card telegram">
        <div class="icon-wrapper"><i class="fab fa-telegram-plane"></i></div>
        <span class="app-name">Telegram</span>
        <span class="open-btn">Open</span>
      </a>
    </main>
    <footer>
      <div class="footer-links">
        <button class="footer-btn" data-modal="privacy">Privacy Policy</button>
        <button class="footer-btn" data-modal="terms-use">Terms of Use</button>
        <button class="footer-btn" data-modal="terms-conditions">Terms &amp; Conditions</button>
      </div>
      <p class="copyright">&copy; 2026 NetWerk. All rights reserved.</p>
    </footer>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <button class="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-content" class="modal-content"></div>
    </div>
  </div>

  <div id="install-banner" class="install-banner hidden" role="dialog" aria-label="Install NetWerk">
    <div class="install-icon" aria-hidden="true"><span></span></div>
    <div class="install-text">
      <strong>Install NetWerk</strong>
      <span>Add to your home screen for quick access</span>
    </div>
    <div class="install-actions">
      <button type="button" class="install-btn" id="install-accept">Install</button>
      <button type="button" class="install-dismiss" id="install-dismiss">Not now</button>
    </div>
  </div>

  <script>
    const modalData = {
      privacy: {
        title: "Privacy Policy",
        content: "<p>Last updated: September 14, 2026</p><p>NetWerk is a simple directory of external social media links. We do not require accounts and do not collect personal information such as names, email addresses, or login credentials.</p><h3>Third-Party Links</h3><p>When you click Open on any platform, you leave NetWerk and are subject to that platform's own privacy policy and terms.</p><h3>Cookies</h3><p>We may use essential cookies or local storage for basic functionality. We do not use tracking cookies for advertising.</p>"
      },
      "terms-use": {
        title: "Terms of Use",
        content: "<p>Last updated: September 14, 2026</p><p>By using NetWerk you agree to use it only for lawful purposes. NetWerk is an independent directory and is not affiliated with Meta, Google, ByteDance, Tencent, or Telegram. The service is provided as is.</p>"
      },
      "terms-conditions": {
        title: "Terms & Conditions",
        content: "<p>Last updated: September 14, 2026</p><p>Platform logos and names are trademarks of their owners and are used for identification only. NetWerk is not liable for content or practices on third-party platforms you open from this page.</p>"
      }
    };

    const overlay = document.getElementById("modal-overlay");
    const modalTitle = document.getElementById("modal-title");
    const modalContent = document.getElementById("modal-content");

    function openModal(key) {
      const data = modalData[key];
      if (!data) return;
      modalTitle.textContent = data.title;
      modalContent.innerHTML = data.content;
      overlay.classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }
    function closeModal() {
      overlay.classList.add("hidden");
      document.body.style.overflow = "";
    }
    document.querySelectorAll(".footer-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { openModal(btn.dataset.modal); });
    });
    document.querySelector(".modal-close").addEventListener("click", closeModal);
    overlay.addEventListener("click", function (e) { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !overlay.classList.contains("hidden")) closeModal();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }

    var deferredPrompt = null;
    var installBanner = document.getElementById("install-banner");
    var installAccept = document.getElementById("install-accept");
    var installDismiss = document.getElementById("install-dismiss");
    var DISMISS_KEY = "netwerk-install-dismissed";

    function isStandalone() {
      return window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true;
    }
    function showInstallBanner() {
      if (isStandalone()) return;
      if (localStorage.getItem(DISMISS_KEY) === "1") return;
      installBanner.classList.remove("hidden");
      requestAnimationFrame(function () { installBanner.classList.add("show"); });
    }
    function hideInstallBanner(permanent) {
      installBanner.classList.remove("show");
      setTimeout(function () { installBanner.classList.add("hidden"); }, 300);
      if (permanent) localStorage.setItem(DISMISS_KEY, "1");
    }

    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(showInstallBanner, 1200);
    });

    window.addEventListener("load", function () {
      setTimeout(function () {
        if (deferredPrompt || isStandalone()) return;
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (isIOS && !localStorage.getItem(DISMISS_KEY)) {
          document.querySelector(".install-text span").textContent =
            "Tap Share, then Add to Home Screen";
          installAccept.style.display = "none";
          showInstallBanner();
        }
      }, 2000);
    });

    installAccept.addEventListener("click", function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        hideInstallBanner(true);
      });
    });
    installDismiss.addEventListener("click", function () { hideInstallBanner(true); });
    window.addEventListener("appinstalled", function () {
      deferredPrompt = null;
      hideInstallBanner(true);
    });
  </script>
</body>
</html>
